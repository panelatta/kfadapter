# Developer deployment built from this checkout. It mirrors the production
# hardening in ../compose.yaml. Pin the project name on every invocation so an
# inherited COMPOSE_PROJECT_NAME cannot select production containers or state.
# Validate with:
#   scripts/preflight.sh --local-build
# and run with:
#   docker compose --env-file /dev/null --project-name chinadapter-local -f deploy/compose.local-build.yaml up -d --build
name: chinadapter-local

services:
  chinadapter:
    image: "${CHINADAPTER_LOCAL_IMAGE:-chinadapter:local}"
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: 0.0.0-local
    network_mode: host
    user: "65532:65532"
    working_dir: /chinadapter
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: "${CHINADAPTER_TZ:-Asia/Shanghai}"
    volumes:
      - db_data:/chinadapter/data
      - type: bind
        source: ../config.yaml
        target: /chinadapter/config.yaml
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "./chinadapter", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
