name: chinadapter

services:
  chinadapter:
    # Production runs one immutable image. scripts/preflight.sh validates these
    # inputs and scripts/upgrade.sh swaps them with automatic rollback. The
    # digest of each published image is shown in the CI job summary.
    image: "${CHINADAPTER_IMAGE_REPOSITORY:-ghcr.io/panelatta/chinadapter}@${CHINADAPTER_IMAGE_DIGEST:?set CHINADAPTER_IMAGE_DIGEST=sha256:<digest> (see scripts/preflight.sh)}"
    network_mode: host
    user: "65532:65532"
    working_dir: /chinadapter
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: "${CHINADAPTER_TZ:-Asia/Shanghai}"
    volumes:
      - db_data:/chinadapter/data
      - type: bind
        source: ./config.yaml
        target: /chinadapter/config.yaml
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "./chinadapter", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
