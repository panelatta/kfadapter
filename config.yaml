# Paths are fixed relative to /chinadapter: configuration is ./config.yaml and
# persistent SQLite data is ./data. Provider control requests go to each
# provider's fixed HTTPS API (KuaiFan and QuickFox); see README.md.

# Shared numeric listener address for management and SOCKS. Production host
# networking makes OpenWrt interface addresses directly bindable. A specific
# address must be assigned to an up local interface; wildcard selects all up
# interfaces of its address family.
listenAddr: 0.0.0.0

# Optional SOCKS DNS hostname and direct HTTP management hostname. localhost is implicitly accepted
# when listenAddr is wildcard or loopback.
# hostname: adapter.example.com

# Management HTTP endpoint.
management:
  port: 10809
  # Optional canonical HTTPS origin of your TLS reverse proxy. No path, trailing
  # slash, credentials, query, fragment, or explicit default :443 port. The proxy
  # must set Host to this authority; forwarding headers are not trusted. Complete
  # first-time setup over local HTTP/SSH before using this public console.
  # publicOrigin: https://console.example.com
  # Lifetime of an authenticated browser session (valid range: 1m through 720h,
  # i.e. 30 days). Go durations have no day unit: 168h is 7 days.
  sessionTTL: 168h

# SOCKS proxy endpoint and upstream connection limits.
proxy:
  port: 10808
  # Fixed TCP ports of the optional inbound protocols. Each listens only after
  # it is enabled in the console; allow the port in the firewall first.
  # snellPort: 10810
  # shadowsocksPort: 10811
  # socksTLSPort: 10812
  # Timeout for opening an upstream connection (valid range: 1s through 10s).
  dialTimeout: 10s
  # Timeout for the upstream protocol handshake (valid range: 1s through 1m).
  handshakeTimeout: 15s

# Provider API request and refresh scheduling; its origin is fixed above.
provider:
  # Per-request timeout (valid range: 1s through 15s).
  requestTimeout: 15s
  # Background refresh cadence (valid range: 15m through 24h).
  refreshInterval: 2h
  # Optional RFC 8484 resolver for QuickFox domain targets. Queries carry the
  # selected node's /24 as EDNS Client Subnet so CDNs answer for the node's
  # network instead of this host's; failures fall back to the system resolver.
  # quickfoxDoH: https://223.5.5.5/dns-query
  # How QuickFox UDP associations reach the node: udp2tcp (default) carries
  # datagrams on a TCP connection; native sends them to the node's UDP port,
  # which needs outbound UDP from this host.
  # quickfoxUDP: native
